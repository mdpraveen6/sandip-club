<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun Launchpad 2026 — Team Slider</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#03110e; --panel:#0a2a22; --line:rgba(255,200,61,.22);
  --teal:#14b8a6; --green:#22c55e; --gold:#ffc83d; --gold-soft:#ffe08a; --text:#eafbf5; --muted:#9fc9bd;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;padding:3.2rem 1rem 5rem}
h1,h2,.pill,.name,.role{font-family:'Orbitron',sans-serif}

/* ---------- HEADER ---------- */
.head{max-width:900px;margin:0 auto;text-align:center}
.head .eyebrow{color:var(--gold);letter-spacing:.35em;font-size:.72rem;font-weight:700}
.head h1{font-size:clamp(1.6rem,4.5vw,2.6rem);margin:.5rem 0 .6rem;color:#fff;
  text-shadow:0 0 24px rgba(255,200,61,.25)}
.head p{color:var(--muted);font-size:1.02rem;max-width:640px;margin:0 auto 1.8rem}

/* ---------- FILTER PILLS ---------- */
.pills{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-bottom:2.6rem}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--muted);
  font-size:.68rem;font-weight:700;letter-spacing:.14em;padding:.65rem 1.15rem;border-radius:99px;
  cursor:pointer;transition:.25s;white-space:nowrap}
.pill:hover{border-color:var(--gold);color:var(--gold-soft)}
.pill.active{background:linear-gradient(135deg,var(--gold),#e2a91f);border-color:transparent;color:#1a1400;box-shadow:0 0 18px rgba(255,200,61,.4)}

/* ---------- SLIDER STAGE ---------- */
.stage{position:relative;max-width:1100px;margin:0 auto;border-radius:28px;overflow:hidden;
  height:min(560px,86vw);border:1px solid var(--line);background:#04140f;
  box-shadow:0 30px 70px rgba(0,0,0,.55)}
.bgwrap{position:absolute;inset:0;overflow:hidden}
.bgimg{position:absolute;inset:-6%;background-size:cover;background-position:center;
  filter:blur(38px) saturate(1.15) brightness(.55);transform:scale(1.15);transition:background-image .5s ease}
.bgtint{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(3,17,14,.55) 0%,rgba(3,17,14,.75) 55%,rgba(3,17,14,.96) 100%),
             radial-gradient(circle at 50% 40%,rgba(20,184,166,.18),transparent 60%)}
.bggrid{position:absolute;inset:0;opacity:.12;
  background-image:linear-gradient(var(--teal) 1px,transparent 1px),linear-gradient(90deg,var(--teal) 1px,transparent 1px);
  background-size:42px 42px}

.track{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1400px}
.card{position:absolute;width:min(240px,46vw);aspect-ratio:3/4;border-radius:18px;overflow:hidden;cursor:pointer;
  transition:transform .65s cubic-bezier(.22,.9,.3,1),opacity .65s ease,filter .65s ease;
  box-shadow:0 20px 45px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.85) 100%)}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:.9rem 1rem;opacity:0;transform:translateY(10px);transition:opacity .4s ease .15s,transform .4s ease .15s}
.card.active .cap{opacity:1;transform:none}
.card .sec{display:block;color:var(--gold);font-size:.6rem;letter-spacing:.16em;font-weight:700;margin-bottom:.3rem}
.card .nm{color:#fff;font-size:1.05rem;font-weight:700;line-height:1.15}
.card .rl{color:var(--gold-soft);font-size:.72rem;letter-spacing:.08em;margin-top:.2rem;font-weight:600}
.card .yr{display:inline-block;margin-top:.5rem;font-size:.62rem;letter-spacing:.06em;color:var(--green);
  border:1px solid rgba(34,197,94,.45);background:rgba(34,197,94,.1);padding:.2rem .55rem;border-radius:99px}
.card.active{box-shadow:0 26px 60px rgba(0,0,0,.6),0 0 0 2px var(--gold),0 0 40px rgba(255,200,61,.35)}

/* nav arrows */
.nav{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;
  background:rgba(4,20,15,.55);border:1px solid var(--line);color:var(--gold-soft);
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;backdrop-filter:blur(6px);transition:.2s}
.nav:hover{background:rgba(255,200,61,.15);border-color:var(--gold)}
.nav.prev{left:14px}.nav.next{right:14px}
.nav svg{width:18px;height:18px}

/* bottom info bar */
.infobar{position:absolute;left:22px;right:22px;bottom:16px;display:flex;align-items:center;gap:.9rem;z-index:4}
.ring{width:34px;height:34px;border-radius:50%;flex:none;
  background:conic-gradient(var(--gold) calc(var(--p,0)*1%),rgba(255,255,255,.15) 0);
  display:flex;align-items:center;justify-content:center}
.ring::after{content:"";width:26px;height:26px;border-radius:50%;background:#04140f}
.info-txt{line-height:1.15}
.info-txt b{font-family:'Orbitron',sans-serif;font-size:.85rem;color:#fff;display:block}
.info-txt span{font-size:.7rem;color:var(--muted);letter-spacing:.08em}
.dots{margin-left:auto;display:flex;gap:.4rem}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:.3s}
.dots i.on{background:var(--gold);width:18px;border-radius:4px}

@media (max-width:640px){ .stage{border-radius:20px} .nav{width:36px;height:36px} }
</style>
</head>
<body>

<div class="head">
  <div class="eyebrow">THE PEOPLE BEHIND IT</div>
  <h1>Meet The Launchpad Team</h1>
  <p>Presidents to video editors — 24 builders across organized teams keeping the Launchpad flying.</p>
</div>

<div class="pills" id="pills"></div>

<div class="stage" id="stage">
  <div class="bgwrap"><div class="bgimg" id="bgimg"></div><div class="bggrid"></div><div class="bgtint"></div></div>
  <div class="track" id="track"></div>
  <div class="nav prev" id="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg></div>
  <div class="nav next" id="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 18l6-6-6-6"/></svg></div>
  <div class="infobar">
    <div class="ring" id="ring"></div>
    <div class="info-txt"><b id="infoName">—</b><span id="infoRole">—</span></div>
    <div class="dots" id="dots"></div>
  </div>
</div>

/* ============================================================ */
const pillsEl = document.getElementById('pills');
const trackEl = document.getElementById('track');
const bgEl = document.getElementById('bgimg');
const dotsEl = document.getElementById('dots');
const ringEl = document.getElementById('ring');
const nameEl = document.getElementById('infoName');
const roleEl = document.getElementById('infoRole');

let filter = 'All';
let list = [];
let idx = 0;
let timer = null, tickTimer = null;
const AUTOPLAY_MS = 3800;

function buildPills(){
  const cats = ['All', ...SECTIONS];
  pillsEl.innerHTML = cats.map(c=>{
    const count = c==='All' ? TEAM.length : TEAM.filter(m=>m.section===c).length;
    return `<div class="pill ${c===filter?'active':''}" data-c="${c}">${c.toUpperCase()}${c==='All' ? ' · '+count : ''}</div>`;
  }).join('');
  [...pillsEl.children].forEach(p=>p.onclick = ()=> setFilter(p.dataset.c));
}
function setFilter(c){
  filter = c; idx = 0;
  buildPills();
  list = filter==='All' ? TEAM : TEAM.filter(m=>m.section===filter);
  buildCards();
  render(true);
  restartAutoplay();
}

function buildCards(){
  trackEl.innerHTML = list.map((m,i)=>`
    <div class="card" data-i="${i}">
      <img src="${m.photo}" alt="${m.name}">
      <div class="shade"></div>
      <div class="cap">
        <span class="sec">${m.section.toUpperCase()}</span>
        <div class="nm">${m.name}</div>
        <div class="rl">${m.role}</div>
        <div class="yr">${m.year}</div>
      </div>
    </div>`).join('');
  [...trackEl.children].forEach(c=> c.onclick = ()=>{ idx = +c.dataset.i; render(true); restartAutoplay(); });
  dotsEl.innerHTML = list.map((_,i)=>`<i data-i="${i}"></i>`).join('');
}

function render(animateBg){
  const n = list.length;
  [...trackEl.children].forEach((card, i)=>{
    let d = i - idx;
    if (d > n/2) d -= n; if (d < -n/2) d += n;
    const abs = Math.abs(d);
    card.classList.toggle('active', d===0);
    if (abs > 2){ card.style.opacity = 0; card.style.pointerEvents='none'; return; }
    card.style.pointerEvents='auto';
    const spread = 190, scale = d===0?1:(abs===1?.72:.5), rot = d*32;
    card.style.transform = `translateX(${d*spread}px) translateZ(${-abs*140}px) rotateY(${-rot}deg) scale(${scale})`;
    card.style.zIndex = 10-abs;
    card.style.opacity = d===0 ? 1 : (abs===1 ? .55 : .28);
    card.style.filter = d===0 ? 'none' : 'brightness(.6) saturate(.7)';
  });
  [...dotsEl.children].forEach((d,i)=> d.classList.toggle('on', i===idx));
  const cur = list[idx];
  if (cur){
    nameEl.textContent = cur.name; roleEl.textContent = cur.role + ' · ' + cur.year;
    if (animateBg) bgEl.style.backgroundImage = `url(${cur.photo})`;
  }
}

function go(delta){ idx = (idx + delta + list.length) % list.length; render(true); }
document.getElementById('next').onclick = ()=>{ go(1); restartAutoplay(); };
document.getElementById('prev').onclick = ()=>{ go(-1); restartAutoplay(); };

/* autoplay + progress ring */
function restartAutoplay(){
  clearInterval(timer); clearInterval(tickTimer);
  let p = 0; ringEl.style.setProperty('--p', 0);
  tickTimer = setInterval(()=>{ p = Math.min(100, p + 100/(AUTOPLAY_MS/60)); ringEl.style.setProperty('--p', p); }, 60);
  timer = setInterval(()=>{ go(1); p = 0; }, AUTOPLAY_MS);
}

/* swipe */
let sx=0, dx=0, dragging=false;
trackEl.addEventListener('pointerdown', e=>{ dragging=true; sx=e.clientX; });
window.addEventListener('pointerup', e=>{ if(!dragging) return; dragging=false; dx=e.clientX-sx;
  if (dx>40) go(-1); else if (dx<-40) go(1); restartAutoplay(); });

/* keyboard */
window.addEventListener('keydown', e=>{ if(e.key==='ArrowRight'){go(1);restartAutoplay();} if(e.key==='ArrowLeft'){go(-1);restartAutoplay();} });

setFilter('All');
</script>
</body>
</html>
