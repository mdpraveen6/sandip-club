<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sun Launchpad 2026 — Loader</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #04130f;
      --teal: #14b8a6;
      --gold: #ffc83d;
      --gold-soft: #ffe08a;
      --text: #d8f3ec;
      --size: min(340px, 64vw)
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Orbitron', system-ui, sans-serif;
      overflow: hidden
    }

    @property --a {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg
    }

    /* ---------- LOADER ---------- */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 42%, #0d3b32 0%, #07211b 45%, var(--bg) 80%);
      transition: opacity .9s ease, transform .9s ease;
    }

    #loader.hide {
      opacity: 0;
      transform: scale(1.06);
      pointer-events: none
    }

    .badge {
      position: relative;
      width: var(--size);
      aspect-ratio: 1
    }

    /* soft breathing glow behind the logo */
    .badge::before {
      content: "";
      position: absolute;
      inset: -22%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 200, 61, .30), rgba(20, 184, 166, .12) 45%, transparent 68%);
      opacity: 0;
      animation: fadeIn 1.2s 1s forwards, breathe 3.6s 2.2s ease-in-out infinite
    }

    @keyframes breathe {
      50% {
        transform: scale(1.08);
        opacity: .75
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1
      }
    }

    /* gold outer ring draws itself */
    .outer {
      position: absolute;
      inset: -4.5%;
      width: 109%;
      height: 109%;
      overflow: visible;
      filter: drop-shadow(0 0 7px rgba(255, 200, 61, .85))
    }

    .outer circle {
      fill: none;
      stroke: var(--gold);
      stroke-width: .9;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      animation: draw 1.4s .2s cubic-bezier(.6, 0, .2, 1) forwards
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0
      }
    }

    /* the logo disc: built layer by layer from the real logo */
    .disc {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      background: #f9f7eb;
      opacity: 0;
      animation: fadeIn .7s 1s forwards;
      box-shadow: 0 0 40px rgba(255, 200, 61, .25)
    }

    /* 1. dark ring sweeps around */
    .ring {
      -webkit-mask-image: conic-gradient(#000 var(--a), transparent var(--a));
      mask-image: conic-gradient(#000 var(--a), transparent var(--a));
      animation: sweep 1.1s 1.5s ease-in-out forwards;
      --a: 0deg
    }

    .ring::after {
      content: "";
      position: absolute;
      inset: 0;
      background: inherit;
      -webkit-mask-image: radial-gradient(circle closest-side, transparent 91%, #000 92%);
      mask-image: radial-gradient(circle closest-side, transparent 91%, #000 92%)
    }

    .ring {
      background: none
    }

    @keyframes sweep {
      to {
        --a: 360deg
      }
    }

    /* 2. bulb + sprout rises up */
    .bulb {
      clip-path: inset(55.5% 0 44.5% 0);
      animation: rise 1s 2.5s cubic-bezier(.3, .7, .2, 1) forwards
    }

    @keyframes rise {
      to {
        clip-path: inset(8% 0 44.5% 0)
      }
    }

    /* 3-5. text fades in */
    .t {
      opacity: 0;
      filter: blur(6px);
      animation: txt .7s ease forwards
    }

    @keyframes txt {
      to {
        opacity: 1;
        filter: blur(0)
      }
    }

    .sun {
      clip-path: inset(56% 0 30% 0);
      animation-delay: 3.4s
    }

    .club {
      clip-path: inset(70.5% 0 15% 0);
      animation-delay: 3.9s
    }

    .tag {
      clip-path: inset(85.5% 0 9.5% 0);
      animation-delay: 4.3s
    }

    /* final sheen */
    .disc::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .75) 50%, transparent 65%);
      transform: translateX(-120%);
      pointer-events: none
    }

    #loader.done .disc::after {
      animation: sheen 1s ease forwards
    }

    @keyframes sheen {
      to {
        transform: translateX(120%)
      }
    }

    #loader.done .badge {
      animation: pop .8s ease
    }

    @keyframes pop {
      40% {
        transform: scale(1.04)
      }
    }

    /* text + progress */
    .name {
      margin-top: 2rem;
      font-weight: 500;
      font-size: clamp(.68rem, 2.4vw, 1rem);
      letter-spacing: .22em;
      padding-left: .22em;
      white-space: nowrap;
      color: var(--gold-soft);
      text-shadow: 0 0 10px rgba(255, 200, 61, .35);
      opacity: 0;
      animation: fadeIn .8s 4.3s forwards
    }

    .bar {
      margin-top: 1.4rem;
      width: min(300px, 68vw);
      height: 4px;
      border-radius: 9px;
      background: rgba(20, 184, 166, .18);
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 9px;
      background: linear-gradient(90deg, var(--teal), var(--gold));
      box-shadow: 0 0 12px var(--gold)
    }

    .pct {
      margin-top: .7rem;
      font-size: .7rem;
      letter-spacing: .3em;
      color: var(--gold-soft)
    }

    @media (prefers-reduced-motion:reduce) {
      .badge::before {
        animation: fadeIn 1s forwards
      }
    }
  </style>
</head>

<body>

  <!-- Your website content goes here (the loader fades out to reveal it) -->

  <!-- ======== LOADER ======== -->
  <div id="loader" aria-label="Loading">
    <div class="badge">
      <svg class="outer" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="49" pathLength="1" />
      </svg>
      <div class="disc">
        <div class="ly ring"></div>
        <div class="ly bulb"></div>
        <div class="ly t sun"></div>
        <div class="ly t club"></div>
        <div class="ly t tag"></div>
      </div>
    </div>
    <div class="name">SANDIP UNIVERSITY, NASHIK</div>
    <div class="bar"><i id="fill"></i></div>
    <div class="pct" id="pct">0%</div>
  </div>

  <script>
    const DURATION = 3800;      // loading time in ms (logo build-up takes ~4.8s)
    const PREVIEW_LOOP = true;  // true = animation replays forever (for previewing).
    // Set to false on your real website so it plays once and fades out.

    const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

    function play() {
      const loader = document.getElementById('loader');
      const fill = document.getElementById('fill'), pct = document.getElementById('pct');
      const t0 = performance.now();
      (function tick(now) {
        const p = Math.min(1, (now - t0) / DURATION), v = Math.round(ease(p) * 100);
        fill.style.width = v + '%'; pct.textContent = v + '%';
        p < 1 ? requestAnimationFrame(tick) : finish();
      })(t0);

      function finish() {
        loader.classList.add('done');
        if (PREVIEW_LOOP) {
          setTimeout(() => {                       // restart: swap in a fresh copy so CSS animations run again
            const fresh = loader.cloneNode(true);
            fresh.classList.remove('done');
            loader.replaceWith(fresh);
            play();
          }, 2500);
          return;
        }
        setTimeout(() => loader.classList.add('hide'), 1100);
        setTimeout(() => loader.style.display = 'none', 2000);
      }
    }
    play();
    /* TIP: to tie it to REAL loading, call finish() inside window.addEventListener('load', ...) */
  </script>
</body>
